<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    color: #1e1e1e;
    background: #fff;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 {
    font-size: 16px;
    font-weight: 700;
    color: #111;
  }

  .instructions {
    color: #666;
    line-height: 1.5;
    font-size: 12px;
  }

  textarea {
    width: 100%;
    min-height: 180px;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    padding: 12px;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 11px;
    line-height: 1.5;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
    color: #1e1e1e;
    background: #fafafa;
  }
  textarea:focus {
    border-color: #3b82f6;
  }
  textarea.error {
    border-color: #ef4444;
  }

  .preview {
    font-size: 12px;
    color: #16a34a;
    min-height: 18px;
  }
  .preview.error {
    color: #ef4444;
  }

  .actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }

  button {
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  button:active { opacity: 0.85; }

  .btn-primary {
    background: #3b82f6;
    color: #fff;
  }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }

  .btn-secondary {
    background: #f3f4f6;
    color: #374151;
  }
  .btn-secondary:hover { background: #e5e7eb; }
</style>
</head>
<body>

<h1>Arbor AI Import</h1>

<p class="instructions">
  Copy the mind map data from Arbor AI
  (<strong>Export &rarr; Figma &rarr; Copy for Figma Plugin</strong>),
  then paste it below.
</p>

<textarea id="json-input" placeholder='{"appName":"Arbor AI","version":1,"nodes":[...],"edges":[...]}'></textarea>

<div id="preview" class="preview"></div>

<div class="actions">
  <button class="btn-secondary" id="cancel-btn">Cancel</button>
  <button class="btn-primary" id="import-btn" disabled>Import</button>
</div>

<script>
  const textarea  = document.getElementById("json-input");
  const preview   = document.getElementById("preview");
  const importBtn = document.getElementById("import-btn");
  const cancelBtn = document.getElementById("cancel-btn");

  let parsedData = null;

  function validate(raw) {
    parsedData = null;
    importBtn.disabled = true;
    textarea.classList.remove("error");
    preview.classList.remove("error");
    preview.textContent = "";

    if (!raw.trim()) return;

    let data;
    try {
      data = JSON.parse(raw);
    } catch (e) {
      textarea.classList.add("error");
      preview.classList.add("error");
      preview.textContent = "Invalid JSON: " + e.message;
      return;
    }

    if (data.appName !== "Arbor AI") {
      textarea.classList.add("error");
      preview.classList.add("error");
      preview.textContent = 'Missing or incorrect "appName" — expected "Arbor AI".';
      return;
    }

    const finitePoint = (point) => point && Number.isFinite(point.x) && Number.isFinite(point.y);
    const freeDrawing = Array.isArray(data.edges) && data.edges.length > 0 && data.edges.every(
      (edge) => edge && edge.source === "" && edge.target === "" &&
        finitePoint(edge.sourcePoint) && finitePoint(edge.targetPoint)
    );
    if (!Array.isArray(data.nodes) || (data.nodes.length === 0 && !freeDrawing)) {
      textarea.classList.add("error");
      preview.classList.add("error");
      preview.textContent = "Add nodes or valid free connectors to the payload.";
      return;
    }

    const edgeCount = Array.isArray(data.edges) ? data.edges.length : 0;
    preview.textContent =
      "Ready: " + data.nodes.length + " node(s), " + edgeCount + " edge(s)";
    parsedData = data;
    importBtn.disabled = false;
  }

  textarea.addEventListener("input", function () {
    validate(this.value);
  });

  importBtn.addEventListener("click", function () {
    if (!parsedData) return;
    parent.postMessage(
      { pluginMessage: { type: "import", payload: parsedData } },
      "*"
    );
  });

  cancelBtn.addEventListener("click", function () {
    parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
  });
</script>

</body>
</html>
